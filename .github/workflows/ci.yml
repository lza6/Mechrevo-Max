name: CI

# 存在意义：把 docs/DEPLOYMENT.md §7 的人工清单自动化，止住「改了代码没改文档 / 测试悄悄变红」这类漂移。
#
# 刻意不做的（原因见 docs/SPEC.md §5.1 与 policy.md §7）：
#   - 真机硬件测试（core/tests/hardware.rs 的 #[ignore]）：CI 无硬件，且真机写入有硬复位风险
#   - GUI E2E：用户明确禁用真机 UI 自动化（改用 docs/qa/ui-smoke-spec.md 的浏览器方案）
#   - 覆盖率作为**阻断门禁**：先上报（见 coverage job），等基线稳定后再收紧

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：本 workflow 只读仓库
permissions:
  contents: read

# 同一分支的新推送取消旧运行，避免排队烧时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: build · test · lint
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 工具链按 rust-toolchain.toml 固定，避免「昨天绿今天红」
      - name: Install Rust（读取 rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache cargo（含 target 增量与 sparse index）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            app/src-tauri -> target

      - name: core · fmt
        working-directory: core
        run: cargo fmt --check

      - name: core · clippy（0 warning 门槛）
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: core · test（单测 + doctest；真机测试保持 ignored）
        working-directory: core
        run: cargo test

      - name: app · fmt
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: app · clippy（0 warning 门槛）
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: app · IPC 命令层单测
        working-directory: app/src-tauri
        run: cargo test --bin mechrevo-max

      - name: app · 前后端契约（解析 app/ui/app.js 的 IPC 表）
        working-directory: app/src-tauri
        run: cargo test --test ipc_contract

      - name: 前端语法
        run: node --check app/ui/app.js

      - name: 合规自检（不得包含官方二进制/驱动/反编译产物）
        shell: bash
        run: |
          hits=$(git ls-files | grep -Ei '\.(sys|msix|msixbundle|dll|exe)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::检测到被禁止入库的二进制/驱动文件:"; echo "$hits"; exit 1
          fi
          echo "合规检查通过：无官方二进制、驱动或反编译产物"

  coverage:
    name: coverage（core，仅上报）
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true # 先只上报不阻断；基线稳定后去掉这行即为门禁

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: 覆盖率摘要（core）
        working-directory: core
        run: cargo llvm-cov --summary-only --ignore-filename-regex 'ec/windows\.rs'

  package:
    name: 打包冒烟（msi/nsis）
    # 只在打 tag 或手动触发时跑：这是唯一能真正验证 P2-08「安装包从未构建」的手段
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建安装包（msi + nsis）
        working-directory: app/src-tauri
        run: npx tauri build

      - name: 列出产物
        shell: bash
        run: |
          find app/src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -printf '%p  %s bytes\n' || true

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mechrevo-max-installers
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
