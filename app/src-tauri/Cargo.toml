[package]
name = "mechrevo-max"
version = "0.1.0"
edition = "2021"
description = "机械革命笔记本控制台 (自研)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mechrevo-core = { path = "../../core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
