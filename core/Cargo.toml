[package]
name = "mechrevo-core"
version = "0.2.0"
edition = "2024"
description = "机械革命 (Mechrevo) 笔记本 EC/硬件控制核心库"
license = "MIT"
repository = "https://github.com/lza6/Mechrevo-Max"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
